<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 背景 -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#F5F5F5"/>

  <!-- 底部扁平投影 -->
  <ellipse cx="128" cy="200" rx="70" ry="10" fill="#000000" opacity="0.08"/>

  <!-- 折叠卡片：顶面（绿，A） -->
  <polygon points="50,80 206,80 194,124 62,124" fill="#4CAF50"/>
  <!-- 顶面顶部高光条 -->
  <polygon points="50,80 206,80 202,88 54,88" fill="#ffffff" opacity="0.16"/>
  <!-- 顶面底部折线加深 -->
  <polygon points="62,124 194,124 192,118 64,118" fill="#388E3C" opacity="0.55"/>

  <!-- 折叠卡片：正面（深色，文） -->
  <polygon points="62,124 194,124 194,184 62,184" fill="#202124"/>
  <!-- 正面底部微亮 -->
  <polygon points="62,178 194,178 194,184 62,184" fill="#2d2e31"/>

  <!-- 顶面：A（斜体，跟随折叠角度） -->
  <text x="128" y="112" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-style="italic" font-weight="700" fill="#F5F5F5" text-anchor="middle" transform="rotate(-7 128 98)">A</text>

  <!-- 折线中央：双向箭头（转换符号） -->
  <g stroke="#F5F5F5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="112" y1="124" x2="144" y2="124"/>
    <path d="M120,118 l-8,6 l8,6"/>
    <path d="M136,118 l8,6 l-8,6"/>
  </g>

  <!-- 正面：文 -->
  <text x="128" y="170" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="42" font-weight="600" fill="#F5F5F5" text-anchor="middle">文</text>
</svg>
